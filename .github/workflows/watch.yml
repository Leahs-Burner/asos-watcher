name: Check ASOS Sample Sale

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load last snapshot
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check the shop
        run: python3 watcher.py

      - name: Save snapshot
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Send alert
        if: hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "$(cat alert_title.txt)" --body-file alert.md

      - name: Daily keep-alive
        # GitHub pauses schedules in projects with no activity for 60 days.
        # One tiny update per day prevents that.
        run: |
          today=$(date -u +%F)
          if [ "$(cat last_checked.txt 2>/dev/null)" != "$today" ]; then
            echo "$today" > last_checked.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add last_checked.txt
            git commit -m "Daily check-in $today"
            git push
          fi

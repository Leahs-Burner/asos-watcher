name: Check ASOS Sample Sale

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Just send a test alert"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: ${{ inputs.test_email }}
        run: |
          echo "Test alert from your ASOS Sample Sale watcher" > alert_title.txt
          echo "If this reached your inbox, alerts are working. You'll get emails like this whenever there are new items, restocks or price drops." > alert.md

      - name: Load last snapshot
        if: ${{ !inputs.test_email }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check the shop
        if: ${{ !inputs.test_email }}
        run: python3 watcher.py

      - name: Save snapshot
        if: ${{ !inputs.test_email }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Publish alert for the email list
        if: ${{ hashFiles('alert.md') != '' }}
        run: |
          python3 publish_alert.py
          gh issue create --title "$(cat alert_title.txt)" --body-file alert.md

      - name: Save alert and daily check-in
        # The Google Sheet script reads alerts/latest.json. The daily check-in
        # stops GitHub pausing the schedule after 60 quiet days.
        run: |
          today=$(date -u +%F)
          if [ "$(cat last_checked.txt 2>/dev/null)" != "$today" ]; then echo "$today" > last_checked.txt; fi
          git add last_checked.txt alerts 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update alerts $today"
            git pull --rebase -q || true
            git push
          fi
